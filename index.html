<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bring Alex die Sporthose!</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f1020;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
            padding: 10px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 3 / 4;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            border: 3px solid #2f3542;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #fff;
        }
        #ui {
            position: absolute;
            top: 4%;
            left: 4%;
            right: 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(14px, 4vw, 18px);
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 0px #fff;
            pointer-events: none;
            z-index: 5;
        }
        .progress-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .progress-bar-bg {
            width: clamp(80px, 25vw, 140px);
            height: clamp(12px, 3vw, 18px);
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #555;
        }
        .progress-bar-fill {
            height: 100%;
            background: #ff4757;
            width: 0%;
            transition: width 0.1s linear;
        }
        #overlay {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(15, 16, 32, 0.92);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8%;
            z-index: 10;
        }
        .overlay-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #overlay h1 { 
            font-size: clamp(22px, 6vw, 30px); 
            margin-bottom: 12px; 
            color: #ffdd59; 
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #overlay h1.game-over {
            color: #ff4757;
            text-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
        }
        #overlay p { 
            font-size: clamp(13px, 3.8vw, 16px); 
            margin-bottom: 24px; 
            line-height: 1.5; 
            color: #dfe4ea; 
        }
        #start-btn {
            width: 100%;
            padding: clamp(14px, 4vw, 18px);
            font-size: clamp(16px, 4.5vw, 20px);
            font-weight: bold;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #start-btn:active { 
            transform: scale(0.96);
            filter: brightness(0.9);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="600" height="800"></canvas>
    
    <div id="ui">
        <div>
            Zeit: <span id="timer-text">15</span>s
        </div>
        <div class="progress-container">
            <span>Abstand:</span>
            <div class="progress-bar-bg">
                <div id="progress" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="overlay">
        <div class="overlay-card">
            <h1 id="overlay-title">Bring Alex die Sporthose!</h1>
            <p id="overlay-desc">Du hast <b>15 Sekunden</b>, um Alex zu motivieren! Tippe auf das Display, um Hindernissen auszuweichen.</p>
            <button id="start-btn">Spiel starten</button>
        </div>
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const timerText = document.getElementById('timer-text');
    const progressBar = document.getElementById('progress');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');
    const gameContainer = document.getElementById('game-container');

    let gameState = 'START';
    let lastTime = 0;
    let gameTime = 15;
    let gameTimerInterval = null;
    let animFrameId = null;

    const GROUND_Y = 650;
    let speed = 9.5;
    let distanceToAlex = 320;
    const MIN_DISTANCE = 45;
    let bgOffset = 0;

    const player = {
        x: 60,
        y: GROUND_Y - 70,
        width: 35,
        height: 70,
        vy: 0,
        gravity: 0.8,
        jumpPower: -20,
        isGrounded: true,
        legAngle: 0
    };

    const alex = {
        x: 380,
        y: GROUND_Y - 70,
        width: 35,
        height: 70,
        vy: 0,
        gravity: 0.8,
        isGrounded: true,
        legAngle: 0,
        catArmAngle: 0
    };

    let obstacles = [];
    let spawnTimer = 0;
    let nextSpawnTime = 0.3;
    let cutsceneTimer = 0;

    function triggerJump(e) {
        if (e && e.target === startBtn) return;
        if (gameState === 'PLAYING' && player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            triggerJump();
        }
    });

    gameContainer.addEventListener('touchstart', (e) => {
        if (e.target !== startBtn) {
            e.preventDefault();
            triggerJump(e);
        }
    }, { passive: false });

    gameContainer.addEventListener('mousedown', (e) => {
        if (e.target !== startBtn) {
            triggerJump(e);
        }
    });

    startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
    });

    function startGame() {
        gameState = 'PLAYING';
        gameTime = 15;
        distanceToAlex = 320;
        speed = 9.5;
        obstacles = [];
        bgOffset = 0;
        spawnTimer = 0;
        nextSpawnTime = 0.3;

        player.x = 60;
        player.y = GROUND_Y - player.height;
        player.vy = 0;
        player.isGrounded = true;

        alex.y = GROUND_Y - alex.height;
        alex.vy = 0;
        alex.isGrounded = true;

        overlay.style.display = 'none';
        timerText.innerText = gameTime;
        progressBar.style.width = '0%';

        clearInterval(gameTimerInterval);
        gameTimerInterval = setInterval(() => {
            if (gameState === 'PLAYING') {
                gameTime--;
                timerText.innerText = gameTime;
                if (gameTime <= 0) {
                    triggerGameOver(false);
                }
            }
        }, 1000);

        lastTime = performance.now();
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animFrameId = requestAnimationFrame(gameLoop);
    }

    function triggerGameOver(won) {
        clearInterval(gameTimerInterval);
        cutsceneTimer = 0;
        gameState = won ? 'WIN_CUTSCENE' : 'FALL_CUTSCENE';
    }

    function gameLoop(now) {
        let dt = (now - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1;
        lastTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'PLAYING') {
            updateGame(dt);
            drawRichBackground();
            drawObstacles();
            drawPlayer();
            drawAlex();
        } else if (gameState === 'WIN_CUTSCENE') {
            updateWinCutscene(dt);
        } else if (gameState === 'FALL_CUTSCENE') {
            updateFallCutscene(dt);
        } else if (gameState === 'LOSE_CUTSCENE') {
            updateLoseCutscene(dt);
        }

        if (gameState !== 'START') {
            animFrameId = requestAnimationFrame(gameLoop);
        }
    }

    function updateGame(dt) {
        player.vy += player.gravity;
        player.y += player.vy;
        if (player.y >= GROUND_Y - player.height) {
            player.y = GROUND_Y - player.height;
            player.vy = 0;
            player.isGrounded = true;
        }

        alex.x = player.x + distanceToAlex;
        bgOffset += speed;

        spawnTimer += dt;
        if (spawnTimer >= nextSpawnTime) {
            spawnTimer = 0;
            let speedFactor = 9.5 / speed;
            nextSpawnTime = (Math.random() * 0.5 + 0.3) * speedFactor;

            let isLamp = Math.random() < 0.45;

            if (isLamp) {
                obstacles.push({
                    type: 'LAMP',
                    x: canvas.width + 50,
                    y: 360,
                    width: 55,
                    height: 35,
                    cleared: false
                });
            } else {
                let randomWidth = Math.floor(Math.random() * 35) + 30;
                let randomHeight = Math.floor(Math.random() * 25) + 35;
                obstacles.push({
                    type: 'FILES',
                    x: canvas.width + 50,
                    y: GROUND_Y - randomHeight,
                    width: randomWidth,
                    height: randomHeight,
                    cleared: false
                });
            }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let ob = obstacles[i];
            ob.x -= speed;

            if (ob.type === 'FILES') {
                let alexJumpDistance = Math.max(65, ob.width + 35);
                if (alex.x + alex.width > ob.x - alexJumpDistance && alex.x < ob.x && alex.isGrounded) {
                    let jumpImpulse = ob.height > 50 ? -19 : -17.5;
                    alex.vy = jumpImpulse;
                    alex.isGrounded = false;
                }
            }

            if (checkCollision(player, ob)) {
                triggerGameOver(false);
                return;
            }

            if (!ob.cleared && ob.x + ob.width < player.x) {
                ob.cleared = true;
                distanceToAlex = Math.max(MIN_DISTANCE, distanceToAlex - 22);
                speed = Math.min(13.5, speed + 0.3);
            }

            if (ob.x + ob.width < -100) {
                obstacles.splice(i, 1);
            }
        }

        alex.vy += alex.gravity;
        alex.y += alex.vy;
        if (alex.y >= GROUND_Y - alex.height) {
            alex.y = GROUND_Y - alex.height;
            alex.vy = 0;
            alex.isGrounded = true;
        }

        player.legAngle += speed * 0.12;
        alex.legAngle += speed * 0.12;
        alex.catArmAngle += 0.25;

        let progressPercent = Math.max(0, Math.min(100, ((320 - distanceToAlex) / (320 - MIN_DISTANCE)) * 100));
        progressBar.style.width = progressPercent + '%';

        if (distanceToAlex <= MIN_DISTANCE) {
            triggerGameOver(true);
        }
    }

    function checkCollision(r1, r2) {
        return !(r1.x > r2.x + r2.width || 
                 r1.x + r1.width < r2.x || 
                 r1.y > r2.y + r2.height || 
                 r1.y + r1.height < r2.y);
    }

    function drawRichBackground() {
        ctx.fillStyle = '#e4ebf5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let localOffset = bgOffset % 400;

        for (let x = -localOffset; x < canvas.width + 400; x += 400) {
            ctx.fillStyle = '#b2bec3';
            ctx.fillRect(x + 80, 0, 4, 80);
            ctx.fillRect(x + 280, 0, 4, 80);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 60, 80, 44, 12);
            ctx.fillRect(x + 260, 80, 44, 12);

            ctx.fillStyle = '#a4b0be';
            ctx.fillRect(x + 30, 140, 100, 180);
            ctx.fillStyle = '#dfe4ea';
            ctx.fillRect(x + 35, 145, 42, 80);
            ctx.fillRect(x + 83, 145, 42, 80);
            ctx.fillRect(x + 35, 230, 42, 85);
            ctx.fillRect(x + 83, 230, 42, 85);

            ctx.fillStyle = '#747d8c';
            ctx.fillRect(x + 180, GROUND_Y - 90, 70, 90);
            ctx.fillStyle = '#2f3542';
            ctx.fillRect(x + 195, GROUND_Y - 120, 30, 30);

            ctx.fillStyle = '#d2dae2';
            ctx.fillRect(x + 310, GROUND_Y - 70, 40, 70);
            ctx.fillStyle = '#2ed573';
            ctx.beginPath();
            ctx.arc(x + 330, GROUND_Y - 85, 22, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = '#70a1ff';
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        ctx.fillStyle = '#3742fa';
        ctx.fillRect(0, GROUND_Y, canvas.width, 10);

        ctx.strokeStyle = '#54a0ff';
        ctx.lineWidth = 2;
        let floorOffset = bgOffset % 60;
        for (let x = -floorOffset; x < canvas.width + 60; x += 60) {
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 60, canvas.height);
            ctx.stroke();
        }
    }

    function drawObstacles() {
        obstacles.forEach(ob => {
            if (ob.type === 'LAMP') {
                ctx.strokeStyle = '#2f3542';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(ob.x + ob.width / 2, 0);
                ctx.lineTo(ob.x + ob.width / 2, ob.y);
                ctx.stroke();

                ctx.fillStyle = '#2f3542';
                ctx.beginPath();
                ctx.moveTo(ob.x, ob.y + ob.height);
                ctx.lineTo(ob.x + 8, ob.y);
                ctx.lineTo(ob.x + ob.width - 8, ob.y);
                ctx.lineTo(ob.x + ob.width, ob.y + ob.height);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(ob.x + 4, ob.y + ob.height - 4, ob.width - 8, 6);

                ctx.fillStyle = 'rgba(241, 196, 15, 0.12)';
                ctx.beginPath();
                ctx.moveTo(ob.x + 4, ob.y + ob.height);
                ctx.lineTo(ob.x - 25, ob.y + ob.height + 200);
                ctx.lineTo(ob.x + ob.width + 25, ob.y + ob.height + 200);
                ctx.lineTo(ob.x + ob.width - 4, ob.y + ob.height);
                ctx.closePath();
                ctx.fill();

            } else {
                ctx.fillStyle = '#f1f2f6';
                ctx.fillRect(ob.x, ob.y, ob.width, ob.height);

                ctx.fillStyle = '#ff4757';
                ctx.fillRect(ob.x - 2, ob.y + ob.height - 12, ob.width + 4, 12);
                ctx.fillStyle = '#1e90ff';
                ctx.fillRect(ob.x + 3, ob.y + Math.floor(ob.height / 2), ob.width - 6, 10);
                ctx.fillStyle = '#2ed573';
                ctx.fillRect(ob.x + 1, ob.y + 4, ob.width - 2, 8);

                ctx.fillStyle = '#747d8c';
                for (let ly = ob.y + 14; ly < ob.y + ob.height - 15; ly += 8) {
                    ctx.fillRect(ob.x + 6, ly, ob.width - 12, 2);
                }
            }
        });
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);

        ctx.strokeStyle = '#222';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(17, 45);
        ctx.lineTo(17 + Math.sin(player.legAngle) * 15, 70);
        ctx.moveTo(17, 45);
        ctx.lineTo(17 - Math.sin(player.legAngle) * 15, 70);
        ctx.stroke();

        ctx.fillStyle = '#ff4757';
        ctx.fillRect(6, 18, 23, 30);

        ctx.fillStyle = '#2f3542';
        ctx.fillRect(6, 42, 23, 10);

        ctx.fillStyle = '#ffdd59';
        ctx.beginPath();
        ctx.arc(17, 12, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#222';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(17, 24);
        ctx.lineTo(32, 28);
        ctx.stroke();

        ctx.fillStyle = '#1e90ff';
        ctx.fillRect(30, 24, 16, 14);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(31, 25, 3, 12);

        ctx.restore();
    }

    function drawAlex(showPants = false) {
        ctx.save();
        ctx.translate(alex.x, alex.y);

        ctx.strokeStyle = showPants ? '#1e90ff' : '#ffdfba';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(17, 45);
        ctx.lineTo(17 + Math.sin(alex.legAngle) * 15, 70);
        ctx.moveTo(17, 45);
        ctx.lineTo(17 - Math.sin(alex.legAngle) * 15, 70);
        ctx.stroke();

        if (showPants) {
            ctx.fillStyle = '#1e90ff';
            ctx.fillRect(6, 42, 23, 14);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(8, 43, 3, 12);
        }

        ctx.fillStyle = '#70a1ff';
        ctx.fillRect(6, 18, 23, 30);

        ctx.fillStyle = '#0652DD';
        ctx.fillRect(4, 18, 27, 5);

        ctx.fillStyle = '#ffdfba';
        ctx.beginPath();
        ctx.arc(17, 12, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#70a1ff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(17, 24);
        ctx.lineTo(28, 28);
        ctx.stroke();

        ctx.fillStyle = '#2ed573';
        ctx.fillRect(25, 12, 24, 30);
        ctx.beginPath();
        ctx.moveTo(25, 12); ctx.lineTo(29, 4); ctx.lineTo(33, 12);
        ctx.moveTo(39, 12); ctx.lineTo(43, 4); ctx.lineTo(47, 12);
        ctx.fill();

        ctx.save();
        ctx.translate(42, 20);
        let waveAngle = Math.sin(alex.catArmAngle) * 0.65 - 0.4;
        ctx.rotate(waveAngle);

        ctx.strokeStyle = '#2ed573';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(16, -18);
        ctx.stroke();

        ctx.fillStyle = '#2ed573';
        ctx.beginPath();
        ctx.arc(16, -18, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
    }

    function drawFallCutsceneScene() {
        ctx.fillStyle = '#e4ebf5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#70a1ff';
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        ctx.fillStyle = '#3742fa';
        ctx.fillRect(0, GROUND_Y, canvas.width, 10);

        ctx.save();
        let pX = player.x;
        let pY = GROUND_Y - 32;

        ctx.fillStyle = '#ff4757';
        ctx.fillRect(pX, pY, 70, 32);

        ctx.fillStyle = '#2f3542';
        ctx.fillRect(pX + 50, pY + 20, 25, 12);

        ctx.fillStyle = '#ffdd59';
        ctx.beginPath();
        ctx.arc(pX - 14, pY + 16, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e90ff';
        ctx.fillRect(pX + 85, pY + 10, 24, 20);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(pX + 87, pY + 12, 4, 16);

        ctx.restore();

        if (cutsceneTimer > 0.3) {
            let alpha = Math.min(1, (cutsceneTimer - 0.3) * 3);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = '900 64px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillText('WASTED', canvas.width / 2 + 4, canvas.height / 2 + 4);

            ctx.fillStyle = '#ff4757';
            ctx.fillText('WASTED', canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }
    }

    function drawOfficeGameOverScene() {
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#34495e';
        ctx.fillRect(0, 0, canvas.width, 550);

        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(0, 550, canvas.width, 250);

        let deskX = 90;
        let deskY = 440;
        let deskW = 420;
        let deskH = 20;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(deskX, deskY, deskW, deskH);
        ctx.fillStyle = '#bdc3c7';
        ctx.fillRect(deskX + 30, deskY + deskH, 20, 140);
        ctx.fillRect(deskX + deskW - 50, deskY + deskH, 20, 140);

        ctx.fillStyle = '#1e272e';
        ctx.fillRect(deskX + 160, deskY - 110, 110, 75);
        ctx.fillRect(deskX + 208, deskY - 35, 14, 35);
        ctx.fillStyle = '#00a8ff';
        ctx.fillRect(deskX + 165, deskY - 104, 100, 63);

        let alexDeskX = deskX + 175;
        
        let chairSeatY = deskY + 20; 
        let alexHeight = 70;
        let targetAlexY = chairSeatY - alexHeight; 
        let sittingProgress = Math.min(1, cutsceneTimer / 0.8);
        
        let startY = GROUND_Y - alexHeight;
        let alexDeskY = startY + (targetAlexY - startY) * sittingProgress;

        ctx.fillStyle = '#2f3542';
        // Stuhllehne nach oben korrigiert (startet jetzt auf Höhe der Sitzfläche und reicht nach oben)
        ctx.fillRect(alexDeskX - 6, chairSeatY - 55, 10, 55);
        ctx.fillStyle = '#1e272e';
        ctx.fillRect(alexDeskX + 190, 570, 30, 15);
        ctx.fillStyle = '#353b48';
        // Stuhlbein zeigt jetzt nach unten zum Boden (von Sitzfläche bis zum Fußboden bei Y = 550)
        ctx.fillRect(alexDeskX + 14, chairSeatY, 10, 550 - chairSeatY);

        ctx.save();

        ctx.fillStyle = '#70a1ff';
        ctx.fillRect(alexDeskX + 10, alexDeskY + 45, 12, 45);
        ctx.fillRect(alexDeskX + 26, alexDeskY + 45, 12, 45);

        ctx.fillStyle = '#70a1ff';
        ctx.fillRect(alexDeskX, alexDeskY, 38, 48);
        ctx.fillStyle = '#0652DD';
        ctx.fillRect(alexDeskX - 2, alexDeskY, 42, 6);

        ctx.fillStyle = '#ffdfba';
        ctx.beginPath();
        ctx.arc(alexDeskX + 19, alexDeskY - 12, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(alexDeskX + 28, alexDeskY + 8);
        let alexWave = Math.sin(cutsceneTimer * 10) * 0.65 - 0.4;
        ctx.rotate(alexWave);
        ctx.strokeStyle = '#70a1ff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(16, -18);
        ctx.stroke();
        ctx.fillStyle = '#ffdfba';
        ctx.beginPath();
        ctx.arc(16, -18, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        let catX = deskX + 325; 
        let catY = deskY - 30;

        ctx.fillStyle = '#2ed573';
        ctx.fillRect(catX, catY, 24, 30);
        ctx.beginPath();
        ctx.moveTo(catX, catY); ctx.lineTo(catX + 4, catY - 8); ctx.lineTo(catX + 8, catY);
        ctx.moveTo(catX + 14, catY); ctx.lineTo(catX + 18, catY - 8); ctx.lineTo(catX + 22, catY);
        ctx.fill();

        let catWave = Math.sin(cutsceneTimer * 10) * 0.65 - 0.4;
        ctx.save();
        ctx.translate(catX + 17, catY + 8);
        ctx.rotate(catWave);
        ctx.strokeStyle = '#2ed573';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(16, -18);
        ctx.stroke();
        ctx.fillStyle = '#2ed573';
        ctx.beginPath();
        ctx.arc(16, -18, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();

        ctx.save();
        let pX = 60;
        let pY = 590;

        ctx.fillStyle = '#ff4757';
        ctx.fillRect(pX, pY, 70, 32);

        ctx.fillStyle = '#2f3542';
        ctx.fillRect(pX + 50, pY + 20, 25, 12);

        ctx.fillStyle = '#ffdd59';
        ctx.beginPath();
        ctx.arc(pX - 14, pY + 16, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e90ff';
        ctx.fillRect(pX + 85, pY + 10, 24, 20);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(pX + 87, pY + 12, 4, 16);

        ctx.restore();
    }

    function updateWinCutscene(dt) {
        cutsceneTimer += dt;
        drawRichBackground();

        if (player.x < 220) player.x += 2;
        alex.x = player.x + 45;

        alex.legAngle += 0.05;
        player.legAngle += 0.05;
        alex.catArmAngle += 0.2;

        drawPlayer();

        if (cutsceneTimer < 1.5) {
            drawAlex(false);
        } else {
            drawAlex(true);
        }

        if (cutsceneTimer > 3) {
            showEndOverlay(true);
        }
    }

    function updateFallCutscene(dt) {
        cutsceneTimer += dt;
        drawFallCutsceneScene();

        if (cutsceneTimer > 1.5) {
            cutsceneTimer = 0;
            gameState = 'LOSE_CUTSCENE';
        }
    }

    function updateLoseCutscene(dt) {
        cutsceneTimer += dt;
        drawOfficeGameOverScene();

        if (cutsceneTimer > 2.5) {
            showEndOverlay(false);
        }
    }

    function showEndOverlay(won) {
        gameState = 'START';
        overlay.style.display = 'flex';
        if (won) {
            overlayTitle.className = "";
            overlayTitle.innerText = "Geschafft! 🎉";
            overlayDesc.innerText = "Du hast Alex rechtzeitig die Sporthose gebracht! Jetzt steht dem Sport nichts mehr im Weg!";
            startBtn.innerText = "Nochmal spielen";
        } else {
            overlayTitle.className = "game-over";
            overlayTitle.innerText = "Game Over";
            overlayDesc.innerText = "Du bist gestürzt oder die Zeit ist abgelaufen! Alex sitzt weiter im Büro und macht keinen Sport.";
            startBtn.innerText = "Erneut versuchen";
        }
    }
});
</script>
</body>
</html>
