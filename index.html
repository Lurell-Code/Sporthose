<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hol Alex ein! - Das Sporthosen-Rennen</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 2 / 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #fff;
        }
        #ui {
            position: absolute;
            top: 3%;
            left: 3%;
            right: 3%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 0px #fff;
            pointer-events: none;
            z-index: 5;
        }
        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress-bar-bg {
            width: clamp(100px, 20vw, 250px);
            height: clamp(12px, 2vw, 20px);
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #555;
        }
        .progress-bar-fill {
            height: 100%;
            background: #ff4757;
            width: 0%;
            transition: width 0.1s linear;
        }
        #overlay {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5%;
            z-index: 10;
        }
        #overlay h1 { 
            font-size: clamp(22px, 4vw, 38px); 
            margin-bottom: 10px; 
            color: #ffdd59; 
        }
        #overlay p { 
            font-size: clamp(12px, 2vw, 18px); 
            margin-bottom: 20px; 
            max-width: 650px; 
            line-height: 1.4; 
            color: #f1f1f1; 
        }
        #start-btn {
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 35px);
            font-size: clamp(16px, 2.5vw, 22px);
            font-weight: bold;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        #start-btn:active { 
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="1000" height="500"></canvas>
    
    <div id="ui">
        <div>
            Zeit: <span id="timer-text">15</span>s
        </div>
        <div class="progress-container">
            <span>Abstand:</span>
            <div class="progress-bar-bg">
                <div id="progress" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="overlay">
        <h1 id="overlay-title">Zieh Alex seine Sporthose an!</h1>
        <p id="overlay-desc">Du hast <b>15 Sekunden</b> Zeit! Tippe auf den Bildschirm, um zu springen.</p>
        <button id="start-btn">SPIEL STARTEN</button>
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const timerText = document.getElementById('timer-text');
    const progressBar = document.getElementById('progress');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');
    const gameContainer = document.getElementById('game-container');

    let gameState = 'START';
    let lastTime = 0;
    let gameTime = 15;
    let gameTimerInterval = null;
    let animFrameId = null;

    const GROUND_Y = 400;
    let speed = 10.5;
    let distanceToAlex = 520;
    const MIN_DISTANCE = 50;
    let bgOffset = 0;

    const player = {
        x: 100,
        y: GROUND_Y - 70,
        width: 35,
        height: 70,
        vy: 0,
        gravity: 0.75,
        jumpPower: -20.5,
        isGrounded: true,
        legAngle: 0
    };

    const alex = {
        x: 620,
        y: GROUND_Y - 70,
        width: 35,
        height: 70,
        vy: 0,
        gravity: 0.75,
        isGrounded: true,
        legAngle: 0,
        catArmAngle: 0
    };

    let obstacles = [];
    let spawnTimer = 0;
    let nextSpawnTime = 0.3;
    let cutsceneTimer = 0;

    function triggerJump(e) {
        if (e && e.target === startBtn) return; // Nicht springen, wenn der Button geklickt wird
        if (gameState === 'PLAYING' && player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
        }
    }

    // Eingabesteuerung für Tastatur, Maus und Touch
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            triggerJump();
        }
    });

    gameContainer.addEventListener('touchstart', (e) => {
        if (e.target !== startBtn) {
            e.preventDefault();
            triggerJump(e);
        }
    }, { passive: false });

    gameContainer.addEventListener('mousedown', (e) => {
        if (e.target !== startBtn) {
            triggerJump(e);
        }
    });

    startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
    });

    function startGame() {
        gameState = 'PLAYING';
        gameTime = 15;
        distanceToAlex = 520;
        speed = 10.5;
        obstacles = [];
        bgOffset = 0;
        spawnTimer = 0;
        nextSpawnTime = 0.3;

        player.x = 100;
        player.y = GROUND_Y - player.height;
        player.vy = 0;
        player.isGrounded = true;

        alex.y = GROUND_Y - alex.height;
        alex.vy = 0;
        alex.isGrounded = true;

        overlay.style.display = 'none';
        timerText.innerText = gameTime;
        progressBar.style.width = '0%';

        clearInterval(gameTimerInterval);
        gameTimerInterval = setInterval(() => {
            if (gameState === 'PLAYING') {
                gameTime--;
                timerText.innerText = gameTime;
                if (gameTime <= 0) {
                    triggerGameOver(false);
                }
            }
        }, 1000);

        lastTime = performance.now();
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animFrameId = requestAnimationFrame(gameLoop);
    }

    function triggerGameOver(won) {
        clearInterval(gameTimerInterval);
        cutsceneTimer = 0;
        gameState = won ? 'WIN_CUTSCENE' : 'LOSE_CUTSCENE';
    }

    function gameLoop(now) {
        let dt = (now - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1;
        lastTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'PLAYING') {
            updateGame(dt);
            drawRichBackground();
            drawObstacles();
            drawPlayer();
            drawAlex();
        } else if (gameState === 'WIN_CUTSCENE') {
            updateWinCutscene(dt);
        } else if (gameState === 'LOSE_CUTSCENE') {
            updateLoseCutscene(dt);
        }

        if (gameState !== 'START') {
            animFrameId = requestAnimationFrame(gameLoop);
        }
    }

    function updateGame(dt) {
        player.vy += player.gravity;
        player.y += player.vy;
        if (player.y >= GROUND_Y - player.height) {
            player.y = GROUND_Y - player.height;
            player.vy = 0;
            player.isGrounded = true;
        }

        alex.x = player.x + distanceToAlex;
        bgOffset += speed;

        spawnTimer += dt;
        if (spawnTimer >= nextSpawnTime) {
            spawnTimer = 0;
            let speedFactor = 10.5 / speed;
            nextSpawnTime = (Math.random() * 0.5 + 0.25) * speedFactor;

            let isLamp = Math.random() < 0.45;

            if (isLamp) {
                obstacles.push({
                    type: 'LAMP',
                    x: canvas.width + 50,
                    y: 175,
                    width: 60,
                    height: 35,
                    cleared: false
                });
            } else {
                let randomWidth = Math.floor(Math.random() * 40) + 30;
                let randomHeight = Math.floor(Math.random() * 25) + 35;
                obstacles.push({
                    type: 'FILES',
                    x: canvas.width + 50,
                    y: GROUND_Y - randomHeight,
                    width: randomWidth,
                    height: randomHeight,
                    cleared: false
                });
            }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let ob = obstacles[i];
            ob.x -= speed;

            if (ob.type === 'FILES') {
                let alexJumpDistance = Math.max(70, ob.width + 40);
                if (alex.x + alex.width > ob.x - alexJumpDistance && alex.x < ob.x && alex.isGrounded) {
                    let jumpImpulse = ob.height > 50 ? -19.5 : -18;
                    alex.vy = jumpImpulse;
                    alex.isGrounded = false;
                }
            }

            if (checkCollision(player, ob)) {
                triggerGameOver(false);
                return;
            }

            if (!ob.cleared && ob.x + ob.width < player.x) {
                ob.cleared = true;
                distanceToAlex = Math.max(MIN_DISTANCE, distanceToAlex - 35);
                speed = Math.min(14.5, speed + 0.35);
            }

            if (ob.x + ob.width < -100) {
                obstacles.splice(i, 1);
            }
        }

        alex.vy += alex.gravity;
        alex.y += alex.vy;
        if (alex.y >= GROUND_Y - alex.height) {
            alex.y = GROUND_Y - alex.height;
            alex.vy = 0;
            alex.isGrounded = true;
        }

        player.legAngle += speed * 0.12;
        alex.legAngle += speed * 0.12;
        alex.catArmAngle += 0.25;

        let progressPercent = Math.max(0, Math.min(100, ((520 - distanceToAlex) / (520 - MIN_DISTANCE)) * 100));
        progressBar.style.width = progressPercent + '%';

        if (distanceToAlex <= MIN_DISTANCE) {
            triggerGameOver(true);
        }
    }

    function checkCollision(r1, r2) {
        return !(r1.x > r2.x + r2.width || 
                 r1.x + r1.width < r2.x || 
                 r1.y > r2.y + r2.height || 
                 r1.y + r1.height < r2.y);
    }

    function drawRichBackground() {
        ctx.fillStyle = '#e4ebf5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let localOffset = bgOffset % 600;

        for (let x = -localOffset; x < canvas.width + 600; x += 600) {
            ctx.fillStyle = '#b2bec3';
            ctx.fillRect(x + 100, 0, 4, 30);
            ctx.fillRect(x + 350, 0, 4, 30);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 80, 30, 44, 10);
            ctx.fillRect(x + 330, 30, 44, 10);

            ctx.fillStyle = '#a4b0be';
            ctx.fillRect(x + 40, 60, 120, 160);
            ctx.fillStyle = '#dfe4ea';
            ctx.fillRect(x + 46, 66, 51, 71);
            ctx.fillRect(x + 103, 66, 51, 71);
            ctx.fillRect(x + 46, 143, 51, 71);
            ctx.fillRect(x + 103, 143, 51, 71);

            ctx.fillStyle = '#747d8c';
            ctx.fillRect(x + 200, GROUND_Y - 70, 70, 70);
            ctx.fillStyle = '#2f3542';
            ctx.fillRect(x + 215, GROUND_Y - 100, 30, 30);
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(x + 250, GROUND_Y - 80, 10, 10);

            ctx.fillStyle = '#ced6e0';
            ctx.fillRect(x + 300, 90, 110, 80);
            ctx.fillStyle = '#ff6b81';
            ctx.fillRect(x + 310, 105, 30, 6);
            ctx.fillStyle = '#1e90ff';
            ctx.fillRect(x + 310, 120, 60, 6);
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(x + 310, 135, 45, 6);

            ctx.fillStyle = '#d2dae2';
            ctx.fillRect(x + 440, GROUND_Y - 55, 30, 55);
            ctx.fillStyle = '#2ed573';
            ctx.beginPath();
            ctx.arc(x + 455, GROUND_Y - 70, 28, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#57606f';
            ctx.fillRect(x + 500, GROUND_Y - 120, 70, 120);
            ctx.fillStyle = '#a4b0be';
            ctx.fillRect(x + 505, GROUND_Y - 110, 28, 50);
            ctx.fillRect(x + 537, GROUND_Y - 110, 28, 50);
            ctx.fillRect(x + 505, GROUND_Y - 55, 28, 50);
            ctx.fillRect(x + 537, GROUND_Y - 55, 28, 50);
        }

        ctx.fillStyle = '#70a1ff';
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        ctx.fillStyle = '#3742fa';
        ctx.fillRect(0, GROUND_Y, canvas.width, 8);

        ctx.strokeStyle = '#54a0ff';
        ctx.lineWidth = 2;
        let floorOffset = bgOffset % 70;
        for (let x = -floorOffset; x < canvas.width; x += 70) {
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 50, canvas.height);
            ctx.stroke();
        }
    }

    function drawObstacles() {
        obstacles.forEach(ob => {
            if (ob.type === 'LAMP') {
                ctx.strokeStyle = '#2f3542';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(ob.x + ob.width / 2, 0);
                ctx.lineTo(ob.x + ob.width / 2, ob.y);
                ctx.stroke();

                ctx.fillStyle = '#2f3542';
                ctx.beginPath();
                ctx.moveTo(ob.x, ob.y + ob.height);
                ctx.lineTo(ob.x + 10, ob.y);
                ctx.lineTo(ob.x + ob.width - 10, ob.y);
                ctx.lineTo(ob.x + ob.width, ob.y + ob.height);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(ob.x + 5, ob.y + ob.height - 4, ob.width - 10, 8);

                ctx.fillStyle = 'rgba(241, 196, 15, 0.15)';
                ctx.beginPath();
                ctx.moveTo(ob.x + 5, ob.y + ob.height);
                ctx.lineTo(ob.x - 20, ob.y + ob.height + 120);
                ctx.lineTo(ob.x + ob.width + 20, ob.y + ob.height + 120);
                ctx.lineTo(ob.x + ob.width - 5, ob.y + ob.height);
                ctx.closePath();
                ctx.fill();

            } else {
                ctx.fillStyle = '#f1f2f6';
                ctx.fillRect(ob.x, ob.y, ob.width, ob.height);

                ctx.fillStyle = '#ff4757';
                ctx.fillRect(ob.x - 2, ob.y + ob.height - 12, ob.width + 4, 12);
                ctx.fillStyle = '#1e90ff';
                ctx.fillRect(ob.x + 3, ob.y + Math.floor(ob.height / 2), ob.width - 6, 10);
                ctx.fillStyle = '#2ed573';
                ctx.fillRect(ob.x + 1, ob.y + 4, ob.width - 2, 8);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(ob.x - 5, ob.y + 18, ob.width + 8, 4);
                ctx.fillRect(ob.x + 4, ob.y + 30, ob.width, 4);

                ctx.fillStyle = '#747d8c';
                for (let ly = ob.y + 14; ly < ob.y + ob.height - 15; ly += 8) {
                    ctx.fillRect(ob.x + 6, ly, ob.width - 12, 2);
                }

                ctx.fillStyle = '#ffa502';
                ctx.beginPath();
                ctx.moveTo(ob.x + ob.width, ob.y);
                ctx.lineTo(ob.x + ob.width - 10, ob.y);
                ctx.lineTo(ob.x + ob.width, ob.y + 10);
                ctx.fill();
            }
        });
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);

        ctx.strokeStyle = '#222';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(17, 45);
        ctx.lineTo(17 + Math.sin(player.legAngle) * 15, 70);
        ctx.moveTo(17, 45);
        ctx.lineTo(17 - Math.sin(player.legAngle) * 15, 70);
        ctx.stroke();

        ctx.fillStyle = '#ff4757';
        ctx.fillRect(6, 18, 23, 30);

        ctx.fillStyle = '#2f3542';
        ctx.fillRect(6, 42, 23, 10);

        ctx.fillStyle = '#ffdd59';
        ctx.beginPath();
        ctx.arc(17, 12, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#222';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(17, 24);
        ctx.lineTo(32, 28);
        ctx.stroke();

        ctx.fillStyle = '#1e90ff';
        ctx.fillRect(30, 24, 16, 14);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(31, 25, 3, 12);

        ctx.restore();
    }

    function drawAlex(showPants = false) {
        ctx.save();
        ctx.translate(alex.x, alex.y);

        ctx.strokeStyle = showPants ? '#1e90ff' : '#ffdfba';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(17, 45);
        ctx.lineTo(17 + Math.sin(alex.legAngle) * 15, 70);
        ctx.moveTo(17, 45);
        ctx.lineTo(17 - Math.sin(alex.legAngle) * 15, 70);
        ctx.stroke();

        if (showPants) {
            ctx.fillStyle = '#1e90ff';
            ctx.fillRect(6, 42, 23, 14);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(8, 43, 3, 12);
        }

        ctx.fillStyle = '#70a1ff';
        ctx.fillRect(6, 18, 23, 30);

        ctx.fillStyle = '#0652DD';
        ctx.fillRect(4, 18, 27, 5);

        ctx.fillStyle = '#ffdfba';
        ctx.beginPath();
        ctx.arc(17, 12, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#70a1ff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(17, 24);
        ctx.lineTo(28, 28);
        ctx.stroke();

        ctx.fillStyle = '#2ed573';
        ctx.fillRect(25, 12, 24, 30);
        ctx.beginPath();
        ctx.moveTo(25, 12); ctx.lineTo(29, 4); ctx.lineTo(33, 12);
        ctx.moveTo(39, 12); ctx.lineTo(43, 4); ctx.lineTo(47, 12);
        ctx.fill();

        ctx.save();
        ctx.translate(42, 20);
        let waveAngle = Math.sin(alex.catArmAngle) * 0.65 - 0.4;
        ctx.rotate(waveAngle);

        ctx.strokeStyle = '#2ed573';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(16, -18);
        ctx.stroke();

        ctx.fillStyle = '#2ed573';
        ctx.beginPath();
        ctx.arc(16, -18, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
    }

    function drawOfficeGameOverScene() {
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#34495e';
        ctx.fillRect(0, 0, canvas.width, 350);

        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(0, 350, canvas.width, 150);
        ctx.strokeStyle = '#95a5a6';
        ctx.lineWidth = 2;
        for (let x = 0; x < canvas.width; x += 90) {
            ctx.beginPath();
            ctx.moveTo(x, 350);
            ctx.lineTo(x - 50, 500);
            ctx.stroke();
        }

        let deskX = 350;
        let deskY = 250;
        let deskW = 550;
        let deskH = 20;

        // Weißer Schreibtisch
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(deskX, deskY, deskW, deskH);
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(deskX + 40, deskY + deskH, 25, 130);
        ctx.fillRect(deskX + deskW - 65, deskY + deskH, 25, 130);

        // Monitore
        ctx.fillStyle = '#1e272e';
        ctx.fillRect(deskX + 50, deskY - 110, 125, 85);
        ctx.fillRect(deskX + 105, deskY - 25, 15, 25);
        ctx.fillRect(deskX + 85, deskY - 3, 50, 3);
        ctx.fillStyle = '#00a8ff';
        ctx.fillRect(deskX + 55, deskY - 104, 115, 73);

        ctx.fillStyle = '#1e272e';
        ctx.fillRect(deskX + 185, deskY - 110, 125, 85);
        ctx.fillRect(deskX + 240, deskY - 25, 15, 25);
        ctx.fillRect(deskX + 220, deskY - 3, 50, 3);
        ctx.fillStyle = '#2ed573';
        ctx.fillRect(deskX + 190, deskY - 104, 115, 73);

        // Hellgraues Radio
        let radioX = deskX + 320;
        let radioY = deskY - 45;

        ctx.strokeStyle = '#a4b0be';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(radioX + 12, radioY);
        ctx.lineTo(radioX + 2, radioY - 55);
        ctx.stroke();
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.arc(radioX + 2, radioY - 55, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d1d8e0';
        ctx.fillRect(radioX, radioY, 70, 45);
        ctx.fillStyle = '#718093';
        ctx.fillRect(radioX + 5, radioY + 8, 30, 30);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(radioX + 42, radioY + 10, 22, 10);
        ctx.fillStyle = '#2f3542';
        ctx.beginPath();
        ctx.arc(radioX + 48, radioY + 30, 4, 0, Math.PI * 2);
        ctx.arc(radioX + 58, radioY + 30, 4, 0, Math.PI * 2);
        ctx.fill();

        // Winkekatze am rechten Tischrand
        ctx.save();
        let catX = deskX + deskW - 40; 
        let catY = deskY - 40;

        ctx.fillStyle = '#2ed573';
        ctx.beginPath();
        ctx.ellipse(catX + 12, catY + 28, 12, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(catX + 2, catY + 25, 20, 15);

        ctx.fillStyle = '#ff4757';
        ctx.fillRect(catX + 4, catY + 18, 16, 3);

        ctx.fillStyle = '#2ed573';
        ctx.beginPath();
        ctx.arc(catX + 12, catY + 11, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(catX + 3, catY + 5); ctx.lineTo(catX + 1, catY - 3); ctx.lineTo(catX + 9, catY + 2);
        ctx.moveTo(catX + 21, catY + 5); ctx.lineTo(catX + 23, catY - 3); ctx.lineTo(catX + 15, catY + 2);
        ctx.fill();

        ctx.fillStyle = '#1e272e';
        ctx.beginPath();
        ctx.arc(catX + 7, catY + 11, 1.5, 0, Math.PI * 2);
        ctx.arc(catX + 17, catY + 11, 1.5, 0, Math.PI * 2);
        ctx.fill();

        let wave = Math.sin(cutsceneTimer * 10) * 0.35;
        ctx.save();
        ctx.translate(catX + 4, catY + 14);
        ctx.rotate(-0.8 + wave);
        ctx.fillStyle = '#2ed573';
        ctx.fillRect(-2, -12, 4, 12);
        ctx.beginPath();
        ctx.arc(0, -12, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();

        // Alex sitzt rechts
        let chairX = deskX + 420;
        let chairY = deskY - 10;

        ctx.strokeStyle = '#1e272e';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(chairX + 15, 385); ctx.lineTo(chairX + 15, chairY + 40);
        ctx.moveTo(chairX - 10, 385); ctx.lineTo(chairX + 40, 385);
        ctx.stroke();
        ctx.fillStyle = '#2f3542';
        ctx.fillRect(chairX - 10, chairY + 30, 55, 14);
        ctx.fillRect(chairX + 35, chairY - 60, 14, 90);

        ctx.save();
        ctx.translate(chairX - 10, chairY - 45);

        ctx.strokeStyle = '#ffdfba';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(25, 60); ctx.lineTo(-2, 60); ctx.lineTo(-2, 100);
        ctx.stroke();

        ctx.fillStyle = '#70a1ff';
        ctx.fillRect(10, 10, 28, 52);

        ctx.fillStyle = '#ffdfba';
        ctx.beginPath();
        ctx.arc(24, -6, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#70a1ff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(20, 25); ctx.lineTo(-15, 38);
        ctx.stroke();
        ctx.restore();

        // Spieler K.O.
        ctx.save();
        let pX = 80;
        let pY = 410;

        ctx.fillStyle = '#ff4757';
        ctx.fillRect(pX, pY, 65, 22);
        ctx.fillStyle = '#ffdd59';
        ctx.beginPath();
        ctx.arc(pX - 12, pY + 11, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(pX + 65, pY + 8); ctx.lineTo(pX + 105, pY + 12);
        ctx.moveTo(pX + 65, pY + 16); ctx.lineTo(pX + 98, pY + 24);
        ctx.stroke();

        ctx.fillStyle = '#1e90ff';
        ctx.fillRect(pX + 120, pY + 5, 25, 18);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(pX + 122, pY + 7, 4, 14);

        ctx.restore();

        ctx.fillStyle = '#ff4757';
        ctx.font = 'bold 26px Arial';
        ctx.textAlign = 'center';
        ctx.fillText("Game Over! Kollision im Büro!", canvas.width / 2, 50);
    }

    function updateWinCutscene(dt) {
        cutsceneTimer += dt;
        drawRichBackground();

        if (player.x < 380) player.x += 2.5;
        alex.x = player.x + 50;

        alex.legAngle += 0.05;
        player.legAngle += 0.05;
        alex.catArmAngle += 0.2;

        drawPlayer();

        if (cutsceneTimer < 1.5) {
            drawAlex(false);
        } else {
            drawAlex(true);
            ctx.fillStyle = '#2ed573';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("Sporthose angezogen! Ab zum Sport! 🏃‍♂️💨", canvas.width / 2, 90);
        }

        if (cutsceneTimer > 4) {
            showEndOverlay(true);
        }
    }

    function updateLoseCutscene(dt) {
        cutsceneTimer += dt;
        drawOfficeGameOverScene();

        if (cutsceneTimer > 3.5) {
            showEndOverlay(false);
        }
    }

    function showEndOverlay(won) {
        gameState = 'START';
        overlay.style.display = 'flex';
        if (won) {
            overlayTitle.innerText = "Geschafft! 🎉";
            overlayDesc.innerText = "Du hast Alex in unter 15 Sekunden eingeholt und ihm seine Sporthose angezogen! Jetzt steht dem Workout nichts mehr im Weg!";
            startBtn.innerText = "NOCHMAL SPIELEN";
        } else {
            overlayTitle.innerText = "GAME OVER!";
            overlayDesc.innerText = "Die Sporthose liegt verlassen am Boden! Du bist K.O. gegangen, während Alex entspannt an seinem Schreibtisch arbeitet.";
            startBtn.innerText = "ERNEUT VERSUCHEN";
        }
    }
});
</script>
</body>
</html>
